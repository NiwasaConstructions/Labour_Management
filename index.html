<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Niwasa Labor Monitor (CCTV Tracker)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-item.active { background-color: #0f766e; color: white; } /* Teal theme */
    </style>
</head>
<body class="h-screen overflow-hidden bg-gray-100 flex items-center justify-center">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="w-full h-full flex items-center justify-center bg-teal-900 absolute z-50 transition-opacity duration-500">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 max-w-full">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-teal-600 mb-1">NIWASA</h1>
                <p class="text-sm text-gray-500">Labor Monitoring System</p>
            </div>
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-3 top-3 text-gray-400"></i>
                        <input type="email" id="loginEmail" required class="w-full pl-10 p-2.5 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-3 top-3 text-gray-400"></i>
                        <input type="password" id="loginPassword" required class="w-full pl-10 p-2.5 border border-gray-300 rounded-lg focus:ring-teal-500 focus:border-teal-500">
                    </div>
                </div>
                <button type="submit" id="loginBtn" class="w-full bg-teal-600 text-white font-bold py-2.5 px-4 rounded-lg hover:bg-teal-700 transition">
                    Sign In
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden w-full h-full flex">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-teal-900 text-white flex flex-col shadow-lg z-10">
            <div class="p-6 text-center border-b border-teal-800">
                <h1 class="text-xl font-bold text-teal-400 tracking-wider">LABOR MONITOR</h1>
                <p class="text-xs text-gray-400 mt-1">CCTV Tracking System</p>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
                <button onclick="switchTab('logs')" id="nav-logs" class="nav-item active w-full flex items-center p-3 rounded-lg hover:bg-teal-800 transition">
                    <i class="fas fa-list w-6 text-center"></i> <span class="ml-2">View Reports</span>
                </button>
                
                <!-- Admin Only Menu Item -->
                <div id="adminMenu" class="hidden">
                    <div class="pt-4 pb-2">
                        <p class="text-xs font-semibold text-teal-500 uppercase tracking-wider ml-3">Admin Panel</p>
                    </div>
                    <button onclick="switchTab('addData')" id="nav-addData" class="nav-item w-full flex items-center p-3 rounded-lg hover:bg-teal-800 transition">
                        <i class="fas fa-video w-6 text-center"></i> <span class="ml-2">CCTV Data Entry</span>
                    </button>
                </div>
            </nav>
            <div class="p-4 border-t border-teal-800 text-center">
                <div class="text-xs text-teal-200 mb-2 truncate" id="currentUserDisplay"></div>
                <div class="text-xs font-bold text-white bg-teal-700 rounded p-1 mb-3" id="userRoleDisplay"></div>
                <button id="logoutBtn" class="w-full flex items-center justify-center p-2 text-red-400 hover:bg-teal-800 rounded transition">
                    <i class="fas fa-sign-out-alt mr-2"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-screen overflow-y-auto">
            <header class="bg-white shadow-sm p-4 sticky top-0 z-10">
                <h2 id="page-title" class="text-2xl font-bold text-gray-800">Labor Reports</h2>
            </header>

            <div class="p-6 flex-1">
                
                <!-- 1. View Logs Tab (Everyone) -->
                <div id="logs" class="tab-content active">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-lg font-bold text-gray-700">Daily Site Efficiency Logs</h3>
                        <select id="filterSite" onchange="renderLogs()" class="p-2 border rounded-lg focus:ring-2 focus:ring-teal-500">
                            <option value="ALL">All Sites</option>
                            <!-- Sites loaded via JS -->
                        </select>
                    </div>
                    <!-- Cards Grid -->
                    <div id="logsContainer" class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                        <!-- Logs injected by JS -->
                    </div>
                </div>

                <!-- 2. Data Entry Tab (Admin Only) -->
                <div id="addData" class="tab-content hidden">
                    <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-100 max-w-4xl mx-auto">
                        <h3 class="text-lg font-bold mb-4 border-b pb-2 text-gray-700"><i class="fas fa-clipboard-check text-teal-600 mr-2"></i>New Labor Record</h3>
                        <form id="laborForm" class="space-y-6">
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Site</label>
                                    <input type="text" id="recordSite" required class="mt-1 w-full p-2 border rounded-lg" placeholder="e.g. Kottawa Site">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Date</label>
                                    <input type="date" id="recordDate" required class="mt-1 w-full p-2 border rounded-lg">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 bg-gray-50 p-4 rounded-lg">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Skilled Labor Count (බාස්ලා)</label>
                                    <input type="number" id="skilledCount" required class="mt-1 w-full p-2 border rounded-lg" min="0" value="0">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Unskilled Labor Count (අත්වැඩ)</label>
                                    <input type="number" id="unskilledCount" required class="mt-1 w-full p-2 border rounded-lg" min="0" value="0">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Actual Work (Hours)</label>
                                    <input type="number" id="workHours" required class="mt-1 w-full p-2 border rounded-lg" min="0" step="0.5" placeholder="e.g. 6.5">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Breaks Taken (Hours)</label>
                                    <input type="number" id="breakHours" required class="mt-1 w-full p-2 border rounded-lg" min="0" step="0.5" placeholder="e.g. 1.5">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Overtime (OT Hours)</label>
                                    <input type="number" id="otHours" class="mt-1 w-full p-2 border rounded-lg" min="0" step="0.5" value="0">
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700">CCTV Admin Note / Weather</label>
                                <textarea id="adminNote" rows="2" class="mt-1 w-full p-2 border rounded-lg" placeholder="Any special observations..."></textarea>
                            </div>

                            <button type="submit" id="saveRecordBtn" class="w-full bg-teal-600 text-white font-bold py-3 rounded-lg hover:bg-teal-700 transition">
                                Save Record
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- ADD NOTE MODAL (For Viewers & Admin) -->
    <div id="noteModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl w-[400px] max-w-full m-4 overflow-hidden">
            <div class="bg-gray-800 p-4 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg"><i class="fas fa-comment-dots mr-2"></i>Add Site Note</h3>
                <button onclick="closeNoteModal()" class="text-gray-300 hover:text-white"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div class="p-6">
                <textarea id="viewerNoteText" rows="3" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-teal-500" placeholder="Type your comment/reason here..."></textarea>
                <button onclick="submitViewerNote()" class="mt-4 w-full bg-teal-600 text-white font-bold py-2.5 rounded-lg hover:bg-teal-700 transition">
                    Post Note
                </button>
            </div>
        </div>
    </div>

    <!-- App Logic -->
    <script type="module" src="app.js"></script>
    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
            document.getElementById('page-title').innerText = tabId === 'logs' ? 'Labor Reports & Efficiency' : 'CCTV Data Entry';
        }
        
        function closeNoteModal() { document.getElementById('noteModal').classList.add('hidden'); }
        document.getElementById('recordDate').valueAsDate = new Date();
    </script>
</body>
</html>
